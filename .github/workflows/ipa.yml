name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Assets/**'
      - 'Package.swift'
      - 'VERSION'
      - '.github/workflows/ipa.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain and device SDK
        run: |
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build CarDSPApp for iPhone
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build \
            --product CarDSPApp \
            --configuration release \
            --triple arm64-apple-ios18.0 \
            --sdk "$SDK_PATH" \
            -v

      - name: Assemble app bundle
        run: |
          set -euo pipefail

          BUILD_DIR=".build/arm64-apple-ios/release"
          APP_DIR="Payload/CarDSP.app"
          BUNDLE_ID="com.thetechysasquatch.CarDSP"
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf Payload CarDSP-*-unsigned.ipa CarDSP-*-signed.ipa
          mkdir -p "$APP_DIR"

          cp "$BUILD_DIR/CarDSPApp" "$APP_DIR/CarDSP"
          chmod +x "$APP_DIR/CarDSP"
          cp Sources/CarDSPApp/Info.plist "$APP_DIR/Info.plist"

          base64 -D -i Assets/AppIcon180.png.b64 -o "$APP_DIR/AppIcon60x60@3x.png"
          sips -z 120 120 "$APP_DIR/AppIcon60x60@3x.png" --out "$APP_DIR/AppIcon60x60@2x.png" >/dev/null
          file "$APP_DIR/AppIcon60x60@3x.png"
          file "$APP_DIR/AppIcon60x60@2x.png"

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable CarDSP" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName CarDSP" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion en" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$APP_DIR/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP_DIR/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$APP_DIR/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:0 string AppIcon60x60" "$APP_DIR/Info.plist"

          if grep -q '\$(' "$APP_DIR/Info.plist"; then
            echo "Unresolved Info.plist build-setting placeholder detected"
            cat "$APP_DIR/Info.plist"
            exit 1
          fi

          plutil -lint "$APP_DIR/Info.plist"
          file "$APP_DIR/CarDSP"

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          IPA="CarDSP-${{ steps.version.outputs.version }}-unsigned.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          unzip -l "$IPA"

      - name: Check for signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -n "$BUILD_CERTIFICATE_BASE64" && -n "$BUILD_PROVISION_PROFILE_BASE64" && -n "$P12_PASSWORD" && -n "$KEYCHAIN_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing assets detected; a signed IPA will also be produced."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing assets are not configured; unsigned IPA only."
          fi

      - name: Install Apple signing assets
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/car-dsp-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/CarDSP.mobileprovision"

      - name: Validate profile and sign app
        if: steps.signing.outputs.available == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          APP_DIR="Payload/CarDSP.app"
          PROFILE_PATH="$RUNNER_TEMP/build.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/car-dsp-signing.keychain-db"
          BUNDLE_ID="com.thetechysasquatch.CarDSP"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          profile_path = runner_temp / "profile.plist"
          entitlements_path = runner_temp / "CarDSP.entitlements"
          with profile_path.open("rb") as f:
              profile = plistlib.load(f)
          entitlements = profile.get("Entitlements", {})
          app_identifier = entitlements.get("application-identifier", "")
          bundle_id = "com.thetechysasquatch.CarDSP"
          if not (app_identifier == bundle_id or app_identifier.endswith("." + bundle_id)):
              raise SystemExit(f"Provisioning profile App ID {app_identifier!r} does not match {bundle_id!r}")
          with entitlements_path.open("wb") as f:
              plistlib.dump(entitlements, f)
          print("Provisioning profile matches CarDSP bundle identifier.")
          PY

          cp "$PROFILE_PATH" "$APP_DIR/embedded.mobileprovision"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/[0-9A-F][0-9A-F][0-9A-F][0-9A-F]/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No usable Apple code-signing identity found in imported certificate."
            exit 1
          fi

          codesign --force \
            --sign "$IDENTITY" \
            --entitlements "$RUNNER_TEMP/CarDSP.entitlements" \
            --timestamp=none \
            "$APP_DIR"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -d --entitlements :- "$APP_DIR" || true

      - name: Create signed IPA
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          IPA="CarDSP-${{ steps.version.outputs.version }}-signed.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          unzip -l "$IPA"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDSP-${{ steps.version.outputs.version }}-unsigned-ipa
          path: CarDSP-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CarDSP-${{ steps.version.outputs.version }}-signed-ipa
          path: CarDSP-${{ steps.version.outputs.version }}-signed.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish alpha release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_SIGNED_IPA: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          UNSIGNED_IPA="CarDSP-${VERSION}-unsigned.ipa"
          SIGNED_IPA="CarDSP-${VERSION}-signed.ipa"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$UNSIGNED_IPA" --clobber
            if [[ "$HAS_SIGNED_IPA" == "true" ]]; then
              gh release upload "$TAG" "$SIGNED_IPA" --clobber
            fi
          else
            FILES=("$UNSIGNED_IPA")
            if [[ "$HAS_SIGNED_IPA" == "true" ]]; then
              FILES+=("$SIGNED_IPA")
            fi
            gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "CarDSP ${VERSION}" \
              --prerelease \
              --notes "CarDSP alpha test release. Includes the CarDSP app icon and an unsigned ARM64 iPhone IPA. When Apple signing secrets are configured, the release also includes a device-provisioned signed IPA."
          fi

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/car-dsp-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/CarDSP.mobileprovision" || true
