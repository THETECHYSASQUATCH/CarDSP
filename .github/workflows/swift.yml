name: DSP Core Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-tests:
    name: DSP Core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
      - name: Show toolchain
        run: swift --version
      - name: Build CarDSPCore
        run: swift build --target CarDSPCore -v
      - name: Run CarDSPCore tests
        run: swift test --filter CarDSPCoreTests -v
